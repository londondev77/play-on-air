
name: Build PlayOnAir for WRT32X

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            pkg-config \
            cmake \
            ninja-build \
            perl \
            python3 \
            binutils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf

      - name: Install ARM musl cross-compiler
        run: |
          curl -fL \
            https://musl.cc/arm-linux-musleabihf-cross.tgz \
            -o /tmp/arm-cross.tgz

          mkdir -p "$HOME/arm-cross"
          tar -xzf /tmp/arm-cross.tgz \
            -C "$HOME/arm-cross"

          echo "$HOME/arm-cross/arm-linux-musleabihf-cross/bin" \
            >> "$GITHUB_PATH"

      - name: Configure cross-compilation
        run: |
          echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER=arm-linux-musleabihf-gcc" \
            >> "$GITHUB_ENV"

          echo "CC_armv7_unknown_linux_musleabihf=arm-linux-musleabihf-gcc" \
            >> "$GITHUB_ENV"

          echo "AR_armv7_unknown_linux_musleabihf=arm-linux-musleabihf-ar" \
            >> "$GITHUB_ENV"

      - name: Build PlayOnAir
        run: |
          cargo build --release \
            --target armv7-unknown-linux-musleabihf

      - name: Inspect binary
        run: |
          BINARY=target/armv7-unknown-linux-musleabihf/release/play-on-air

          test -f "$BINARY"
          file "$BINARY"
          readelf -h "$BINARY"
          readelf -l "$BINARY"

          arm-linux-musleabihf-strip "$BINARY"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: play-on-air-wrt32x
          path: target/armv7-unknown-linux-musleabihf/release/play-on-air
          if-no-files-found: error
          retention-days: 30
